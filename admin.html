<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2a38" />
  <title>FishMar | Entrar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="auth">
    <form class="auth-card stack" id="loginForm" novalidate>
      <div class="center">
        <div class="auth-logo">🐟</div>
        <h1 style="font-size:1.6rem;font-weight:800;">FishMar</h1>
        <p class="muted mt-8">Entra con tu correo y tu contraseña</p>
      </div>

      <div id="loginError" class="error-message" role="alert"></div>

      <div class="field">
        <label for="email">Correo</label>
        <input id="email" class="input" type="email" inputmode="email" autocomplete="username"
               autocapitalize="none" placeholder="ejemplo@correo.com" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="password-wrap">
          <input id="password" class="input" type="password" autocomplete="current-password" placeholder="Tu contraseña" />
          <button type="button" class="password-toggle" id="togglePassword" aria-label="Mostrar contraseña">
            <i class="fa-regular fa-eye"></i> Ver
          </button>
        </div>
      </div>

      <button type="submit" class="btn btn-primary btn-lg btn-block" id="btnEntrar">
        Entrar <i class="fa-solid fa-arrow-right"></i>
      </button>

      <p class="muted small center">¿Olvidaste tu contraseña? Pide al administrador que te la cambie.</p>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
