<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FishMar | Acceso</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      min-height: 100vh;
      background: url('https://scontent-qro1-2.xx.fbcdn.net/v/t39.30808-6/433536873_923432783116269_989285097131161897_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=1d70fc&_nc_eui2=AeGKNn3GgiFoFbvxhnCsokMs8wJWksUCPuHzAlaSxQI-4cLLTuEmYdMvM3hbDLLyUSGiLPrzVbEtpdEngV1zcz5e&_nc_ohc=HtkjcyibaDcQ7kNvwF6RD-n&_nc_oc=Adq2G45CY1Wtg0ibmRT1woGGz5jejyF3dfxvAMgjzvY4uM7v_HDoheANYZ2iSgy5s0w&_nc_zt=23&_nc_ht=scontent-qro1-2.xx&_nc_gid=NMz-aXCbWxJQsc7ynBoARQ&_nc_ss=7a32e&oh=00_AfzUu_Xa2BrCoubRvhsaaD62Q17Tf5hQAfUG_bu-0kMMEQ&oe=69C746C3') no-repeat center center fixed;
      background-size: cover;
      position: relative;
    }

    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 0;
    }

    .auth-shell {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px);
      border-radius: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      padding: 40px 32px;
      width: min(440px, 100%);
      border: 1px solid rgba(255, 255, 255, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .auth-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 30px 50px rgba(0, 0, 0, 0.4);
    }

    .auth-card h1 {
      margin: 0 0 8px 0;
      font-size: 2.2rem;
      text-align: center;
      color: #ffffff;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      letter-spacing: -0.5px;
    }

    .auth-card p {
      text-align: center;
      color: #f0f0f0;
      margin-bottom: 32px;
      font-size: 1rem;
      opacity: 0.9;
    }

    .input-icon {
      position: relative;
      margin-bottom: 20px;
    }

    .input-icon i {
      position: absolute;
      left: 16px;
      top: 50%;
      transform: translateY(-50%);
      color: #0ea5a4;
      font-size: 1.2rem;
      pointer-events: none;
      font-style: normal;
    }

    .input-icon input {
      width: 100%;
      padding: 14px 16px 14px 48px;
      border: none;
      border-radius: 40px;
      font-size: 1rem;
      background: rgba(255, 255, 255, 0.9);
      transition: all 0.3s;
      outline: none;
      color: #15202b;
    }

    .input-icon input:focus {
      background: white;
      box-shadow: 0 0 0 3px rgba(14, 165, 164, 0.5);
    }

    .primary-btn {
      width: 100%;
      background: linear-gradient(135deg, #0ea5a4, #0b7f7e);
      color: white;
      border: none;
      border-radius: 40px;
      padding: 14px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      margin-top: 8px;
    }

    .primary-btn:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    .extra-links {
      text-align: center;
      margin-top: 24px;
    }

    .extra-links a {
      color: #f0f0f0;
      text-decoration: none;
      font-size: 0.85rem;
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .extra-links a:hover {
      opacity: 1;
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <main class="auth-shell">
    <div class="auth-card">
      <h1>🐟 FishMar</h1>
      <p>Acceso de administrador y repartidor</p>

      <div class="input-icon">
        <i>📧</i>
        <input id="email" type="email" placeholder="Correo electrónico" />
      </div>

      <div class="input-icon">
        <i>🔒</i>
        <input id="password" type="password" placeholder="Contraseña" />
      </div>

      <button class="primary-btn" onclick="login()">Entrar</button>

      <div class="extra-links">
        <a href="#">¿Olvidaste tu contraseña?</a>
      </div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
  <script src="js/supabase.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
