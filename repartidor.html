<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0d2a38" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="icon" href="/icons/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="FishMar" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  <title>FishMar | Repartidor</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>

<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <div class="brand-logo">🛵</div>
      <div class="brand-text">
        <div class="brand-title" id="nombreRepartidor">Repartidor</div>
        <div class="brand-sub">Tus entregas de FishMar</div>
      </div>
    </div>
    <button class="btn-appbar" onclick="logout()"><i class="fa-solid fa-right-from-bracket"></i> Salir</button>
  </div>
</header>

<main class="page stack">

  <!-- Dinero del día -->
  <section class="money-card">
    <div class="row-between">
      <div>
        <div class="money-label">Dinero que debes entregar hoy</div>
        <div class="money-amount" id="saldoPendiente">$0.00</div>
      </div>
      <div class="money-icon"><i class="fa-solid fa-wallet"></i></div>
    </div>
    <div class="money-split">
      <div><span>Cobraste en efectivo</span><strong id="totalRecaudado">$0.00</strong></div>
      <div><span>Ya entregaste</span><strong id="totalEntregado">$0.00</strong></div>
    </div>
    <button class="btn btn-block btn-lg money-btn" onclick="abrirModalEntrega()">
      <i class="fa-solid fa-hand-holding-dollar"></i> Entregar dinero al negocio
    </button>
  </section>

  <!-- Pedidos -->
  <section id="seccionPedidos">
    <div class="section-head">
      <div>
        <h2 class="section-title">Mis pedidos</h2>
        <p class="section-sub" id="resumenPedidos">Cargando…</p>
      </div>
    </div>
    <div class="chips" id="filtrosRepartidor">
      <button class="chip is-active" data-modo="pendientes">Por entregar <span class="count" id="countPendientes">0</span></button>
      <button class="chip" data-modo="hoy">Todos los de hoy</button>
      <button class="chip" data-modo="fecha"><i class="fa-regular fa-calendar"></i> Otro día</button>
    </div>
    <div class="field mt-8" id="campoFecha" hidden>
      <label for="filtroFechaRepartidor">Elige el día</label>
      <input type="date" id="filtroFechaRepartidor" class="input" />
    </div>
    <div id="misPedidos" class="stack mt-16"></div>
  </section>

  <!-- Historial de dinero entregado -->
  <details class="more card" id="seccionHistorial">
    <summary><span><i class="fa-solid fa-clock-rotate-left"></i> Dinero que ya entregaste</span></summary>
    <div class="stack mt-8">
      <div class="row">
        <div class="field grow">
          <label for="historialFechaInicio" class="small">Desde</label>
          <input type="date" id="historialFechaInicio" class="input" />
        </div>
        <div class="field grow">
          <label for="historialFechaFin" class="small">Hasta</label>
          <input type="date" id="historialFechaFin" class="input" />
        </div>
      </div>
      <div class="row">
        <button class="btn btn-soft grow" onclick="cargarHistorialEntregas()">Buscar</button>
        <button class="btn btn-outline grow" onclick="limpiarFiltroHistorial()">Ver todo</button>
      </div>
      <div id="historialEntregas" class="list"></div>
      <p class="small muted"><i class="fa-solid fa-circle-info"></i> Si registraste una cantidad equivocada, pide al administrador que la corrija.</p>
    </div>
  </details>
</main>

<!-- Hoja: entregar dinero -->
<div id="modalEntrega" class="modal" onclick="if (event.target === this) cerrarModalEntrega()">
  <div class="sheet">
    <div class="sheet-header">
      <h3 class="sheet-title">Entregar dinero</h3>
      <button class="sheet-close" onclick="cerrarModalEntrega()" aria-label="Cerrar">&times;</button>
    </div>
    <div class="sheet-body">
      <div class="total-line">
        <span class="muted strong">Te falta entregar hoy</span>
        <span class="amount" id="saldoModal">$0.00</span>
      </div>
      <button class="btn btn-soft btn-block" onclick="entregarTodo()">
        <i class="fa-solid fa-check-double"></i> Entregar todo
      </button>
      <div class="field">
        <label for="entregaMonto">¿Cuánto vas a entregar?</label>
        <input type="number" id="entregaMonto" class="input" inputmode="decimal" step="0.01" min="0.01" placeholder="Ej. 500" />
      </div>
      <div class="field">
        <label for="entregaNotas">Nota (opcional)</label>
        <input type="text" id="entregaNotas" class="input" maxlength="200" placeholder="Ej. Se lo di a la cajera" />
      </div>
    </div>
    <div class="sheet-footer">
      <button class="btn btn-primary btn-lg btn-block" id="btnRegistrarEntrega" onclick="registrarEntrega()">
        <i class="fa-solid fa-check"></i> Registrar entrega
      </button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<script src="js/supabase.js"></script>
<script src="js/utils.js"></script>
<script src="js/repartidor.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
